name: pinterest public live resolution

on:
  schedule:
    - cron: '17 7 * * 3'
  workflow_dispatch:
    inputs:
      public_url:
        description: 'Public URL, never a private or signed media URL'
        required: false
        type: string

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'An unconfigured public live source is NOT verified.'

  live:
    name: pinterest / Live (public only)
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.public_url != '') || vars.SGET_PINTEREST_PUBLIC_TEST_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-provider-live.js pinterest
        env:
          IGD_LIVE_URL: ${{ inputs.public_url || vars.SGET_PINTEREST_PUBLIC_TEST_URL }}
