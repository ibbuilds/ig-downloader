name: Provider checks

on:
  push:
    branches: [main]
    paths:
      - 'providers/**'
      - 'core/**'
      - 'lib/**'
      - 'shared/**'
      - 'package.json'
      - 'tests/providers/**'
      - 'scripts/check-providers.js'
      - '.github/workflows/provider-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'providers/**'
      - 'core/**'
      - 'lib/**'
      - 'shared/**'
      - 'package.json'
      - 'tests/providers/**'
      - 'scripts/check-providers.js'
      - '.github/workflows/provider-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.providers.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: providers
        run: echo "matrix=$(node scripts/check-providers.js --matrix)" >> "$GITHUB_OUTPUT"

  adapter:
    name: Provider / ${{ matrix.provider }}
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-providers.js --check "$PROVIDER_ID"
        env:
          PROVIDER_ID: ${{ matrix.provider }}
