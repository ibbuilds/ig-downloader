name: instagram live resolution

on:
  schedule:
    - cron: '17 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Live check requires IGD_INSTAGRAM_TEST_URL; an unconfigured live job is skipped, not verified.'

  live:
    name: instagram / Live
    if: ${{ vars.IGD_INSTAGRAM_TEST_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-provider-live.js instagram
        env:
          IGD_LIVE_URL: ${{ vars.IGD_INSTAGRAM_TEST_URL }}
          IG_COOKIE: ${{ secrets.IGD_INSTAGRAM_COOKIE }}
